name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-and-deploy:
    name: release and deploy
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VYLK_DEPLOY_HOOK_LANDER_URL: ${{ secrets.VYLK_DEPLOY_HOOK_LANDER_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create release and dispatch deployment hooks
        run: python3 .github/scripts/release_deploy.py
