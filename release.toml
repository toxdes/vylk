[project]
id = "vylk"
name = "Vylk"
version_file = "VERSION"
description = "Lightweight, low-resource single-binary markdown notes editor"
homepage = "https://github.com/toxdes/vylk"
repository = "https://github.com/toxdes/vylk"
license = "MIT"
maintainer = "toxdes <hi@toxdes.com>"

[build]
dockerfile = "Dockerfile"
context = "."
output_dir = "dist"
platforms = ["linux/amd64", "linux/arm64"]

[build.args]
INCLUDE_APPIMAGE = "0"

[release]
[[release.artifacts]]
name = "vylk_{version}_amd64.tar.gz"
platform = "linux"
architecture = "x86_64"

[[release.artifacts]]
name = "vylk_{version}_arm64.tar.gz"
platform = "linux"
architecture = "arm64"

[[release.artifacts]]
name = "vylk_linux_amd64_{version}"
platform = "linux"
architecture = "x86_64"

[[release.artifacts]]
name = "vylk_linux_arm64_{version}"
platform = "linux"
architecture = "arm64"

[[release.artifacts]]
name = "vylk_darwin_amd64_{version}"
platform = "macos"
architecture = "x86_64"

[[release.artifacts]]
name = "vylk_darwin_arm64_{version}"
platform = "macos"
architecture = "arm64"

[[release.artifacts]]
name = "vylk_windows_amd64_{version}.exe"
platform = "windows"
architecture = "x86_64"

[artifacts]
deb = ["*.deb"]
rpm = ["*.rpm"]
archive = ["*.tar.gz"]

[package]
binary = "vylk"

[deb]
package_name = "vylk"
section = "utils"
priority = "optional"
architectures = ["amd64", "arm64"]

[rpm]
package_name = "vylk"
release = "1"
architectures = ["x86_64", "aarch64"]

[aur]
binary_package = "vylk-bin"
git_package = "vylk-git"
srcinfo_helper_image = "docker.io/toxdes/yesb-aur-helper@sha256:e0b511b58baf4d1e281b154a50fd15125f886472dc7166a4aa578cb7a40435ea"
architectures = ["x86_64", "aarch64"]
git_pkgbuild = "PKGBUILD"

[hosting]
public_base_url = "https://packages.toxdes.com"
apt_prefix = "apt"
rpm_prefix = "rpm"
release_prefix = "releases"

[hosting.apt]
suite = "stable"
component = "main"
origin = "toxdes"
label = "Toxdes"

[hosting.signing]
gpg_key_env = "GPG_KEY_ID"
gpg_passphrase_env = "GPG_PASSPHRASE"

[hosting.aur]
host = "aur.archlinux.org"
ssh_user = "aur"
maintainer = "toxdes <hi@toxdes.com>"
